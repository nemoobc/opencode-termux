name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: rakit 6 artefak
        run: bash scripts/build-release.sh dist
      - name: publish ke npm registry
        env: { NPM_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret kosong, lewati publish npm"
            exit 0
          fi
          npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          npm publish --access public --ignore-scripts
      - name: unggah ke GitHub Releases
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            echo "aset diperbarui pada rilis $TAG"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
            echo "rilis $TAG dibuat dengan $(ls dist | wc -l) aset"
          fi
