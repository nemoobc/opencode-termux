name: release-please

# Dinonaktifkan otomatis (hanya manual) untuk mencegah bentrok dua mekanisme
# bump versi dengan sync-upstream.yml. Kontrol rilis kini dipegang sync-upstream.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          target-branch: main
