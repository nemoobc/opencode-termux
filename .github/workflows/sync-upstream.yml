name: sync upstream opencode

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
    steps:
      - uses: actions/checkout@v4
      - id: sync
        name: cek & sesuaikan versi upstream
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          UP=$(curl -sf https://registry.npmjs.org/@opencode%2Fcli/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          CUR=$(python3 -c "import json; print(json.load(open('package.json')).get('opencodeUpstream',''))")
          echo "upstream=$UP | current=$CUR"
          if [ "$UP" = "$CUR" ]; then
            echo "sudah sinkron — tidak ada yang dilakukan"
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|\"opencodeUpstream\": \"[^\"]*\"|\"opencodeUpstream\": \"$UP\"|" package.json
          NEWVER=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          # anti-bentrok: versi baru harus bebas di TAG lokal & remote, dan belum ada di npm
          until ! git ls-remote --exit-code --tags origin "refs/tags/v$NEWVER" >/dev/null 2>&1 \
                && ! npm view "@nemoobc/opencode-termux@$NEWVER" version >/dev/null 2>&1; do
            echo "v$NEWVER sudah terpakai (tag/npm) — naikkan"
            NEWVER=$(python3 -c "import sys; a=sys.argv[1].split('.'); a[-1]=str(int(a[-1])+1); print('.'.join(a))" "$NEWVER")
          done
          python3 - "$NEWVER" <<'PYEOF'
          import json, sys
          p = json.load(open('package.json'))
          p['version'] = sys.argv[1]
          with open('package.json', 'w') as f:
              json.dump(p, f, indent=2)
              f.write('\n')
          # sync package-lock.json version juga (anti lock basi — HUKUM 10)
          try:
              l = json.load(open('package-lock.json'))
              l['version'] = sys.argv[1]
              if 'packages' in l and '' in l['packages']:
                  l['packages']['']['version'] = sys.argv[1]
              with open('package-lock.json', 'w') as f:
                  json.dump(l, f, indent=2)
                  f.write('\n')
          except: pass
          PYEOF
          git config user.name "nemoobc"
          git config user.email "258114617+nemoobc@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "sync: upstream opencode $UP"
          git tag "v$NEWVER"
          git push
          git push origin "v$NEWVER"
          # GITHUB_TOKEN tidak pernah memicu workflow via push-tag (aturan anti-rekursi GitHub),
          # jadi release dipicu eksplisit via workflow_dispatch (pengecualian resmi).
          gh workflow run release.yml --ref "v$NEWVER"
          echo "tag v$NEWVER didorong + release.yml di-dispatch -> 6 artefak dibangun"
          echo "synced=true" >> "$GITHUB_OUTPUT"

      - name: setup-node untuk auth registry npm (.npmrc)
        if: steps.sync.outputs.synced == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - name: publish npm (kalau NPM_TOKEN dipasang)
        if: steps.sync.outputs.synced == 'true'
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN belum dipasang — skip publish"; exit 0; fi
          npm publish --access public || echo "publish gagal — cek manual"
      - name: publish ke GitHub Packages
        if: steps.sync.outputs.synced == 'true'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          echo "//npm.pkg.github.com/:_authToken=$GH_TOKEN" > .npmrc
          echo "@nemoobc:registry=https://npm.pkg.github.com" >> .npmrc
          npm publish --access public || echo "publish GH Packages gagal — cek manual"
