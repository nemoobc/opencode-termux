name: publish npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: "https://registry.npmjs.org" }
      - name: publish npm (paket @nemoobc/opencode-termux)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          VER=$(node -p "require('./package.json').version")
          if npm view "@nemoobc/opencode-termux@$VER" version >/dev/null 2>&1; then
            echo "v$VER sudah ada di npm — tidak publish ulang"
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN belum dipasang — gagal"; exit 1; fi
          npm publish --access public
          echo "✅ v$VER terbit di npm"
