name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: struktur + unit test
        run: node test/run.mjs

  e2e-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: e2e penuh x64 (unduh bundle + smoke test + subcommand)
        env: { OCX_E2E: "1" }
        run: node test/run.mjs

  e2e-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: e2e arm64 native (loader + binary opencode arm64 diuji di host arm64)
        env: { OCX_ARCH: "arm64", OCX_FORCE: "1", HOME: "${{ runner.temp }}" }
        run: |
          node install.mjs
          ./vendor/ld-musl.so ./vendor/opencode --version
