name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: struktur + unit test
        run: node test/run.mjs

  e2e-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: e2e penuh x64 (host musl alpine x64 via docker — medan sama dengan arm64)
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/w -w /w \
            -e OCX_E2E=1 -e HOME=/tmp \
            node:20-alpine \
            sh -c "apk add --no-cache tar bash git >/dev/null 2>&1; node test/run.mjs"

  e2e-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: e2e arm64 native (loader musl + binary opencode musl diuji di host arm64 via container Alpine)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/w -w /w \
            -e OCX_FORCE=1 -e HOME=/tmp \
            node:20-alpine \
            sh -c "apk add --no-cache tar bash git >/dev/null 2>&1; node test/run.mjs"
